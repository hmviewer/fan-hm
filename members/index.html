<header class="navbar"><div class="nav-inner"><a class="logo" href="../">스타 대학 정보</a><nav class="nav-menu" aria-label="상단 메뉴"><a href="../live/">대학티어</a><a href="../members/" class="active">FA현황</a></nav><a class="nav-live" href="../members/">FA현황</a></div></header>
<main class="page">
  <section class="member-hero" aria-label="FA현황 안내"><div class="member-hero-content"><div><div class="hero-kicker">STAR UNIVERSITY INFO</div><h1 class="hero-title">FA현황</h1><p class="hero-sub">현재 FA 상태의 스타 대학 멤버를 확인하세요.</p></div><div class="hero-stat-card"><div class="stat-row"><span class="stat-label">TOTAL FA</span><span class="stat-value" id="faTotal">-</span></div><div class="stat-row"><span class="stat-label">STATUS</span><span class="stat-value live">FA</span></div></div></div></section>
  <section class="member-section"><div class="group-head"><h2 class="group-title"><span class="group-dot"></span>FA</h2></div><div class="fa-status-grid" id="faRoster"><div class="empty-card">FA현황을 불러오는 중…</div></div></section>
</main>
<footer class="site-footer"><div class="footer-brand"><span>스타 대학 정보</span></div><div class="footer-links"><a href="../policy/#terms">서비스 이용약관</a><a href="../policy/#privacy">개인정보 처리방침</a><a href="../policy/#youth">청소년 보호정책</a></div><div class="footer-info">스타크래프트 대학 정보 정리 페이지 · 문의: <a href="mailto:simple852@naver.com">simple852@naver.com</a> · © 2026 스타 대학 정보. All rights reserved.</div></footer>
<script>
const MEMBERS_URL = "../api/members.php";
const DEFAULT_PROFILE_IMAGE = "https://profile.img.sooplive.co.kr/LOGO/sy/sysdemian/sysdemian.jpg";
const esc = (v) => String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
function getProfileImage(id) { id = String(id || "").trim(); return id ? `https://profile.img.sooplive.co.kr/LOGO/${encodeURIComponent(id.slice(0, 2))}/${encodeURIComponent(id)}/${encodeURIComponent(id)}.jpg` : DEFAULT_PROFILE_IMAGE; }
function fallbackAvatar(img) { img.onerror = null; img.src = DEFAULT_PROFILE_IMAGE; }
function stationUrl(id) { return `https://www.sooplive.com/station/${encodeURIComponent(id)}`; }
function renderFaCard(m) { const id = String(m.soopId || m.id || "").trim(); const name = esc(m.name || id || "-"); return `<a class="fa-card" href="${stationUrl(id)}" target="_blank" rel="noopener"><img src="${getProfileImage(id)}" onerror="fallbackAvatar(this)" alt="${name}" loading="lazy"><div><strong>${name}</strong><span>${esc(id)}</span></div><em>FA</em></a>`; }
async function loadFaRoster() { const target = document.getElementById("faRoster"); const total = document.getElementById("faTotal"); try { const r = await fetch(MEMBERS_URL, { cache: "no-store" }); if (!r.ok) throw new Error("members"); const data = await r.json(); const rows = (Array.isArray(data) ? data : []).filter(Boolean); if (total) total.textContent = rows.length.toLocaleString("ko-KR"); target.innerHTML = rows.length ? rows.map(renderFaCard).join("") : '<div class="empty-card">등록된 FA가 없습니다.</div>'; } catch (e) { if (total) total.textContent = "-"; target.innerHTML = '<div class="empty-card">FA현황을 불러오지 못했습니다.</div>'; } }
loadFaRoster();
</script>
</body>
